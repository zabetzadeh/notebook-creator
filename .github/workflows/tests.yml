name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Python persistence and creation tests
        run: python -m unittest discover -s tests -v
        env:
          NOTEBOOK_TEST_LIVE: '1'
      - name: JavaScript save-queue tests
        run: node tests/test_client.cjs
      - name: JavaScript syntax
        run: node --check web/creator.js
      - name: Repository whitespace
        run: git diff --check
